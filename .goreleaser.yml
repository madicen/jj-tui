# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: jj-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: jj-tui
    main: .
    binary: jj-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/madicen/jj-tui/internal/version.Version=v{{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: jj-tui
    repository:
      owner: madicen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/madicen/jj-tui"
    description: "A modern Terminal User Interface for managing Jujutsu repositories"
    license: "MIT"
    binaries:
      - jj-tui
    # Unsigned GitHub release binaries are quarantined on macOS. Quarantine
    # alone is not enough on recent macOS: Gatekeeper SIGKILLs the
    # linker/ad-hoc signature (Code Signature Invalid). Strip quarantine and
    # re-sign ad-hoc in preflight. Proper fix later: Developer ID + notarization.
    caveats: |
      On macOS, if Gatekeeper blocks a GitHub/direct download ("Not Opened" /
      Code Signature Invalid), clear quarantine and re-sign ad-hoc:

        xattr -dr com.apple.quarantine "$(which jj-tui)"
        codesign --force --sign - "$(which jj-tui)"

      Or use System Settings → Privacy & Security → Open Anyway.
      Prefer `brew install --cask madicen/tap/jj-tui` (cask preflight handles this).
    hooks:
      pre:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/jj-tui"]
            run "/usr/bin/codesign", args: ["--force", "--sign", "-", "{{ .StagedPath }}/jj-tui"]
          end

release:
  github:
    owner: madicen
    name: jj-tui
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

